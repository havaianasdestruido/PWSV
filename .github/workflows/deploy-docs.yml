name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - arena/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@2a18d0513237a4049363a520f850402b6637b923 # v1.222.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Docusaurus dependencies & build docs
        run: |
          cd docusaurus
          npm ci
          npm run build
          cd ..
          mkdir -p docs
          cp -r docusaurus/build/* docs/

      - name: Build Jekyll primary site
        run: |
          bundle exec jekyll build --destination _site
          # Ensure /docs contains Docusaurus static build
          mkdir -p _site/docs
          cp -r docusaurus/build/* _site/docs/

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
